upstream staging_django {
    server django:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    client_max_body_size 100M;

    # Built SPA (production Vite build mounted at /var/www/app)
    root /var/www/app;
    index index.html;

    # Static files collected by Django (whitenoise manifest also works; these
    # are served directly for cache-friendliness).
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # WebSocket upgrade for submission status (Channels via Daphne)
    location /ws/ {
        proxy_pass http://staging_django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # API and Django admin go to the ASGI application
    location ~ ^/(api|admin|health)/ {
        proxy_pass http://staging_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every non-file route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
