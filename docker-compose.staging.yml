# CodeArena STAGING rehearsal stack — production-like topology.
# Differences from docker-compose.prod.yml: plain HTTP on :8080, SPA dist
# mounted from the local build, DB/Redis never published to the host.
# Secrets come from .env.staging (gitignored, generated locally).
#
# Usage:
#   npm --prefix frontend run build          # produce frontend/dist
#   docker compose -f docker-compose.staging.yml up -d --build
#   docker compose -f docker-compose.staging.yml exec django python manage.py seed_e2e
#   open http://localhost:8080

services:
  postgres:
    image: postgres:15-alpine
    env_file: .env.staging
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # No host ports: reachable only from the internal network.

  redis:
    image: redis:7-alpine
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # No host ports.

  django:
    build: ./backend
    env_file: .env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - staging_static_files:/app/staticfiles
      - staging_media_files:/app/media
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  celery_worker:
    build: ./backend
    entrypoint: []
    # Non-eager judge: separate worker consuming the judge queue (plus
    # default/contests). List form: no shell quoting pitfalls.
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=info
      - --pool=solo
      - --queues=default,judge,contests
      - --hostname=staging-worker@%h
    env_file: .env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  celery_beat:
    build: ./backend
    entrypoint: []
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env.staging
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      django: {condition: service_healthy}
    volumes:
      - ./nginx/staging/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/app:ro
      - staging_static_files:/app/staticfiles:ro
      - staging_media_files:/app/media:ro
    restart: unless-stopped

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_static_files:
  staging_media_files:
