# CodeArena PUBLIC production stack — canonical deployment for the pilot.
#
# Standard external ports 80 (ACME + redirect) and 443 (TLS). The domain is
# NEVER hardcoded: it comes from DOMAIN in the environment file, and nginx
# renders ${DOMAIN} via its envsubst template mechanism.
#
# Prerequisites (see PUBLIC_RELEASE_CHECKLIST.md):
#   1. cp .env.example .env.prod && fill real values (DOMAIN, ACME_EMAIL, secrets)
#   2. scripts/init_production_certs.sh          # throwaway self-signed pair so nginx boots
#   3. docker compose -f docker-compose.production.yml up -d
#   4. certbot certonly --webroot (step 5 of the checklist) replaces the placeholder
#   5. docker compose -f docker-compose.production.yml restart nginx
#
# Frontend: build `frontend/dist` before `up` (nginx mounts it read-only).

name: codearena-prod

services:
  postgres:
    image: postgres:15-alpine
    env_file: .env.prod
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  django:
    build: ./backend
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      # Secure defaults live in production.py (COOKIE_SECURE=True,
      # SECURE_SSL_REDIRECT=True, HSTS off until checklist item HSTS is done).
      # CSRF_TRUSTED_ORIGINS / CORS_ALLOWED_ORIGINS / ALLOWED_HOSTS / SECURE_*
      # all come from .env.prod — no hosts hardcoded here.
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - prod_static_files:/app/staticfiles
      - prod_media_files:/app/media
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  celery_worker:
    build: ./backend
    entrypoint: []
    # Judge worker — non-eager, dedicated queues.
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=info
      - --pool=solo
      - --queues=default,judge,contests
      - --hostname=prod-worker@%h
    env_file: .env.prod
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always

  celery_beat:
    build: ./backend
    entrypoint: []
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env.prod
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      CERT_DIR: /etc/letsencrypt/live/${DOMAIN}
      FRONTEND_ROOT: /var/www/app
      # Production serves on 443 — the redirect target needs no port suffix.
      REDIRECT_PORT_SUFFIX: ""
    depends_on:
      django: {condition: service_healthy}
    volumes:
      - ./nginx/https/app.conf.template:/etc/nginx/templates/app.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./frontend/dist:/var/www/app:ro
      - prod_static_files:/app/staticfiles:ro
      - prod_media_files:/app/media:ro
    restart: always

  certbot:
    image: certbot/certbot:latest
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Renewal loop: checks twice daily; nginx re-reads certs on restart.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  prod_postgres_data:
  prod_redis_data:
  prod_static_files:
  prod_media_files:
